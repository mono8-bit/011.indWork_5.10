services:
  laravel_app:
    container_name: "laravel_dev7"
    build: .
    ports:
      - "8082:80"
    volumes:
      - "./www:/var/www/html"
    depends_on:
      - pgsql
  pgsql:
    container_name: "pgsql6"
    image: postgres:17.2
    ports:
      - "5434:5432"
    volumes:
      - "./data:/var/lib/postgresql/data"
    environment:
        POSTGRES_PASSWORD: pgsql
